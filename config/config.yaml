defaults:
  - _self_
  - env: mujoco
  - algorithm: sac
  - experiment: baseline
  - randomization: rand_conf
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

seed: 42
total_steps: 10000

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}